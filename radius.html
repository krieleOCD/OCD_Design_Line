<!-- @dsCard group="Spacing" viewport="700x160" name="Corner radius" subtitle="Square by default — rounding reserved for chips & ornaments" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--color-bg);font-family:var(--font-family-base);color:var(--color-text)}body{display:flex;gap:20px;align-items:flex-end}.item{text-align:center}.box{width:88px;height:64px;background:var(--ocd-orange)}.lbl{font-family:var(--font-family-mono);font-size:11px;color:var(--color-text-secondary);margin-top:8px}</style></head><body><div class="item"><div class="box" style="border-radius:0;"></div><div class="lbl">--radius-none<br>control / card</div></div><div class="item"><div class="box" style="border-radius:4px;"></div><div class="lbl">--radius-sm<br>sm</div></div><div class="item"><div class="box" style="border-radius:10px;"></div><div class="lbl">--radius-lg<br>lg</div></div><div class="item"><div class="box" style="border-radius:999px;width:88px;height:36px"></div><div class="lbl">--radius-pill<br>chip</div></div></body></html>
