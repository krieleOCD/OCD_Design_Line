<!-- @dsCard group="Colors" viewport="700x160" name="Status colours" subtitle="Functional success / info / warning / danger" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--color-bg);font-family:var(--font-family-base);color:var(--color-text)}body{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:8px}.chip{height:56px;border-radius:var(--radius-sm)}.bg{height:22px;border-radius:var(--radius-xs)}.name{font-weight:700;font-size:13px}.hex{font-size:11px;color:var(--color-text-secondary);font-family:var(--font-family-mono)}</style></head><body><div class="sw"><div class="chip" style="background:var(--color-success)"></div><div class="bg" style="background:var(--color-success-bg)"></div><div class="name">Success</div><div class="hex">#50BE87</div></div><div class="sw"><div class="chip" style="background:var(--color-info)"></div><div class="bg" style="background:var(--color-info-bg)"></div><div class="name">Info</div><div class="hex">#4BB4E6</div></div><div class="sw"><div class="chip" style="background:var(--color-warning)"></div><div class="bg" style="background:var(--color-warning-bg)"></div><div class="name">Warning</div><div class="hex">#FFD200</div></div><div class="sw"><div class="chip" style="background:var(--color-danger)"></div><div class="bg" style="background:var(--color-danger-bg)"></div><div class="name">Danger</div><div class="hex">#CD3C14</div></div></body></html>
