<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orange Cyberdefense</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0}a{color:var(--ocd-orange)}a:hover{color:var(--ocd-orange-hover)}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="SiteHeader.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Services.jsx"></script>
<script type="text/babel" src="SiteSections.jsx"></script>
<script type="text/babel" src="ContactScreen.jsx"></script>
<script type="text/babel" data-presets="react">
function App(){
  const [view, setView] = React.useState("home");
  const nav = (v) => { setView(v); window.scrollTo(0,0); };
  return (
    <div>
      <SiteHeader onNav={nav} />
      {view === "home" ? (
        <React.Fragment>
          <Hero onNav={nav} />
          <StatBar />
          <Services />
          <CtaBanner onNav={nav} />
        </React.Fragment>
      ) : (
        <ContactScreen onNav={nav} />
      )}
      <SiteFooter />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
