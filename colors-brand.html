<!-- @dsCard group="Colors" viewport="700x150" name="Brand core" subtitle="Orange, black & white — the primary triad" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px;background:var(--color-bg);display:flex;gap:12px}
.sw{flex:1;display:flex;flex-direction:column;gap:8px}
.chip{height:66px;border-radius:var(--radius-sm)}
.b{border:1px solid var(--color-border)}
.meta{font-family:var(--font-family-base);font-size:12px;line-height:1.3}
.name{font-weight:700;color:var(--color-text)}
.hex{color:var(--color-text-secondary);text-transform:uppercase}
.tok{color:var(--color-text-muted);font-family:var(--font-family-mono);font-size:11px}
</style></head><body>
<div class="sw"><div class="chip" style="background:var(--ocd-orange)"></div><div class="meta"><div class="name">Orange</div><div class="hex">#FF7900 · PMS 151 C</div><div class="tok">--ocd-orange</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ocd-black)"></div><div class="meta"><div class="name">Black</div><div class="hex">#000000</div><div class="tok">--ocd-black</div></div></div>
<div class="sw"><div class="chip b" style="background:var(--ocd-white)"></div><div class="meta"><div class="name">White</div><div class="hex">#FFFFFF</div><div class="tok">--ocd-white</div></div></div>
</body></html>
