<!-- @dsCard group="Colors" viewport="700x150" name="Secondary palette" subtitle="Base hues for accents, illustration & data" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px;background:var(--color-bg);display:flex;gap:10px}
.sw{flex:1;display:flex;flex-direction:column;gap:8px}
.chip{height:66px;border-radius:var(--radius-sm)}
.meta{font-family:var(--font-family-base);font-size:12px;line-height:1.3}
.name{font-weight:700;color:var(--color-text)}
.hex{color:var(--color-text-secondary);text-transform:uppercase;font-size:11px}
</style></head><body>
<div class="sw"><div class="chip" style="background:var(--ocd-blue)"></div><div class="meta"><div class="name">Blue</div><div class="hex">#4BB4E6</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ocd-green)"></div><div class="meta"><div class="name">Green</div><div class="hex">#50BE87</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ocd-purple)"></div><div class="meta"><div class="name">Purple</div><div class="hex">#A885D8</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ocd-pink)"></div><div class="meta"><div class="name">Pink</div><div class="hex">#FFB4E6</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ocd-yellow)"></div><div class="meta"><div class="name">Yellow</div><div class="hex">#FFD200</div></div></div>
</body></html>
