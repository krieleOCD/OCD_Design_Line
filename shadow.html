<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Flat by default — shadows reserved for overlays" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--color-bg);font-family:var(--font-family-base);color:var(--color-text)}body{display:flex;gap:22px;align-items:center;background:var(--grey-100)}.item{text-align:center}.box{width:110px;height:70px;background:#fff;border-radius:var(--radius-sm)}.lbl{font-family:var(--font-family-mono);font-size:11px;color:var(--color-text-secondary);margin-top:10px}</style></head><body><div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lbl">--shadow-sm</div></div><div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lbl">--shadow-md</div></div><div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lbl">--shadow-lg</div></div><div class="item"><div class="box" style="box-shadow:var(--shadow-overlay)"></div><div class="lbl">--shadow-overlay</div></div></body></html>
