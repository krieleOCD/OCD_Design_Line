<!-- @dsCard group="Colors" viewport="700x210" name="Secondary tints" subtitle="Deep & light tints of each secondary hue" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px;background:var(--color-bg);display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px}
.sw{flex:1;display:flex;flex-direction:column;gap:6px}
.chip{height:40px;border-radius:var(--radius-sm)}
.meta{font-family:var(--font-family-base);font-size:11px;line-height:1.25}
.name{font-weight:700;color:var(--color-text)}
.hex{color:var(--color-text-secondary);text-transform:uppercase}
.lbl{font-family:var(--font-family-base);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-muted)}
</style></head><body>
<div class="lbl">Deep tints</div>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--ocd-blue-deep)"></div><div class="meta"><div class="name">Blue deep</div><div class="hex">#085EBD</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ocd-green-deep)"></div><div class="meta"><div class="name">Green deep</div><div class="hex">#0A6E31</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ocd-purple-deep)"></div><div class="meta"><div class="name">Purple deep</div><div class="hex">#492191</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ocd-pink-deep)"></div><div class="meta"><div class="name">Pink deep</div><div class="hex">#FF8AD4</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ocd-orange-amber)"></div><div class="meta"><div class="name">Amber</div><div class="hex">#FFB400</div></div></div>
</div>
<div class="lbl">Light tints</div>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--ocd-blue-light)"></div><div class="meta"><div class="name">Blue light</div><div class="hex">#B5E8F7</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ocd-green-light)"></div><div class="meta"><div class="name">Green light</div><div class="hex">#B8EBD6</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ocd-purple-light)"></div><div class="meta"><div class="name">Purple light</div><div class="hex">#D9C2F0</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ocd-pink-light)"></div><div class="meta"><div class="name">Pink light</div><div class="hex">#FFE8F7</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ocd-yellow-light)"></div><div class="meta"><div class="name">Yellow light</div><div class="hex">#FFF6B6</div></div></div>
</div>
</body></html>
