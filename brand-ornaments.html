<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:0;background:var(--ocd-black);display:flex;align-items:center;gap:34px;padding:26px}
.q{width:120px;height:120px;background:var(--ocd-orange);border-radius:0 0 100% 0}
.half{width:150px;height:75px;border-radius:150px 150px 0 0;overflow:hidden}
.half img{width:100%;height:150px;object-fit:cover;display:block}
.ring{width:120px;height:120px;border-radius:50%;background:var(--ocd-orange);display:flex;align-items:center;justify-content:center}
.ring .core{width:56px;height:56px;border-radius:50%;background:var(--ocd-black)}
.wq{width:120px;height:120px;background:var(--ocd-white);border-radius:100% 0 100% 100%}</style></head>
<body>
<div class="q"></div>
<div class="wq"></div>
<div class="half"><img src="../assets/visuals/visual-04.png" alt=""></div>
<div class="ring"><div class="core"></div></div>
</body></html>
