<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--color-bg);font-family:var(--font-family-base);color:var(--color-text)}body{font-size:13px;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 32px;max-width:620px}.k{font-family:var(--font-family-mono);color:var(--color-text-secondary)}.v{font-weight:700}</style></head><body><div class="grid">
<div class="k">--duration-fast</div><div class="v">150ms</div>
<div class="k">--duration-base</div><div class="v">240ms</div>
<div class="k">--duration-slow</div><div class="v">400ms</div>
<div class="k">--ease-standard</div><div class="v">cubic-bezier(0.2,0,0,1)</div>
</div></body></html>
